name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  # 1. BACKEND – Install, Lint, Unit Tests
  # ═══════════════════════════════════════════════════════════
  backend:
    name: Backend (Lint + Jest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Run ESLint
        run: npm run lint --if-present

      - name: 🧪 Run Jest unit tests
        run: npm test

      - name: 📊 Upload coverage (if available)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: api/coverage/
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════
  # 2. FRONTEND – Install, Lint, Vitest, Build
  # ═══════════════════════════════════════════════════════════
  frontend:
    name: Frontend (Lint + Vitest + Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Run ESLint
        run: npm run lint --if-present

      - name: 🧪 Run Vitest tests
        run: npm test

      - name: 🏗️ Build production bundle
        run: npm run build

      - name: 📊 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: client/dist/

  # ═══════════════════════════════════════════════════════════
  # 3. NEWMAN – API tests against running backend
  # ═══════════════════════════════════════════════════════════
  newman:
    name: Newman API Tests
    runs-on: ubuntu-latest
    needs: [backend]             # run only if backend passed

    defaults:
      run:
        working-directory: api

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Create .env for CI
        run: |
          cat > .env << 'EOF'
          PORT=4000
          NODE_ENV=test
          JWT_SECRET=ci-test-secret-key-min-32-characters-long
          JWT_EXPIRES_IN=1h
          USE_HTTPS=false
          EOF

      - name: 🚀 Start backend server in background
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          npx wait-on http://localhost:4000/api/health -t 30000 || (cat server.log && exit 1)

      - name: 🧪 Run Newman collection
        run: npm run test:api

      - name: 📄 Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: |
            api/newman/
            postman/results.json
          if-no-files-found: ignore

      - name: 🛑 Stop backend
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
